# SmartWin Project - Quality Metrics Configuration
# Version: 1.0.0

project: "SmartWin AI Governance Platform"

code_quality:
  coverage:
    unit_test_coverage:
      target: 80
      minimum: 70
      unit: "percent"
    integration_test_coverage:
      target: 70
      minimum: 60
      unit: "percent"
    e2e_test_coverage:
      target: 60
      minimum: 50
      unit: "percent"

  defect_metrics:
    defect_rate:
      target: 3
      maximum: 5
      unit: "defects per 1000 lines"
    critical_defects:
      target: 0
      maximum: 0
    high_defects:
      target: 0
      maximum: 2
    medium_defects:
      target: 5
      maximum: 10
    defect_resolution_time:
      critical: "4 hours"
      high: "24 hours"
      medium: "72 hours"
      low: "7 days"

  code_smell:
    duplicated_lines_density:
      target: 3
      maximum: 5
      unit: "percent"
    cognitive_complexity:
      target: 15
      maximum: 25
    cyclomatic_complexity:
      target: 10
      maximum: 15

  security:
    vulnerabilities_critical: 0
    vulnerabilities_high: 0
    vulnerabilities_medium: 5
    security_hotspots_reviewed: 100
    unit: "count"

performance:
  api_response_time:
    p50: 200
    p95: 500
    p99: 1000
    unit: "milliseconds"

  throughput:
    target: 1000
    minimum: 800
    unit: "requests per second"

  availability:
    target: 99.5
    minimum: 99.0
    unit: "percent"

  resource_usage:
    cpu_limit: 80
    memory_limit: 85
    unit: "percent"

  concurrent_users:
    normal: 500
    peak: 1000

testing:
  functional:
    pass_rate:
      target: 95
      minimum: 90
      unit: "percent"

  automation:
    automation_rate:
      target: 70
      minimum: 60
      unit: "percent"

  regression:
    pass_rate:
      target: 100
      minimum: 98
      unit: "percent"
    execution_time:
      target: 30
      maximum: 60
      unit: "minutes"

  performance:
    load_test_pass_rate: 100
    stress_test_pass_rate: 95

documentation:
  api_coverage:
    target: 100
    unit: "percent"
    description: "All public APIs must be documented"

  code_comment_density:
    target: 15
    minimum: 10
    unit: "percent"

  outdated_docs_ratio:
    maximum: 5
    unit: "percent"

  required_docs:
    - "README.md"
    - "ARCHITECTURE.md"
    - "API_DOCUMENTATION.md"
    - "DATABASE_DESIGN.md"
    - "DEPLOYMENT_GUIDE.md"
    - "TROUBLESHOOTING.md"

delivery:
  on_time_delivery:
    target: 90
    minimum: 85
    unit: "percent"

  sprint_velocity:
    target_story_points: 40
    minimum_story_points: 32

  rework_rate:
    target: 5
    maximum: 10
    unit: "percent"

monitoring:
  tools:
    - name: "SonarQube"
      purpose: "Code quality analysis"
      frequency: "On every PR"
    - name: "GitHub Actions"
      purpose: "CI/CD and automated testing"
      frequency: "On every push"
    - name: "Prometheus + Grafana"
      purpose: "Runtime performance monitoring"
      frequency: "Real-time"
    - name: "ELK Stack"
      purpose: "Log analysis"
      frequency: "Real-time"

  reporting:
    daily: ["build_status", "test_pass_rate"]
    weekly: ["coverage_trend", "defect_trend", "velocity"]
    monthly: ["overall_quality_score", "technical_debt"]
    milestone: ["full_quality_report", "acceptance_criteria_check"]
