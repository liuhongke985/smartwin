    name: "项目启动完成"
    version: "v0.1.0"
    target_date: "2026-01-31"
    week: "W4"
    description: "完成项目启动，建立治理框架，确认团队和工具"
    acceptance_criteria:
      - "项目章程已批准并签署"
      - "团队全部就位，角色明确"
      - "开发环境配置完成"
      - "CI/CD流程可运行"
      - "第一批Issues已创建"
    deliverables:
      - "PROJECT_CHARTER.md"
      - "PROJECT_SCHEDULE.md"
      - "开发环境配置文档"
      - "CI/CD初始配置"
    dependencies: []
    gate_review: true

  - id: "M2"
    name: "架构设计完成"
    version: "v0.2.0"
    target_date: "2026-02-28"
    week: "W8"
    description: "完成系统整体架构设计，技术选型确认"
    acceptance_criteria:
      - "系统架构文档已评审并批准"
      - "数据库设计完成"
      - "API接口规范定义"
      - "安全架构设计完成"
      - "原型验证完成"
    deliverables:
      - "ARCHITECTURE.md"
      - "DATABASE_DESIGN.md"
      - "API_DOCUMENTATION.md"
      - "ADR文档集"
    dependencies: ["M1"]
    gate_review: true

  - id: "M3"
