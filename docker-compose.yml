# SmartWin Local Development Environment
# Usage: docker-compose up -d
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smartwin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: smartwin_root
      MYSQL_DATABASE: smartwin
      MYSQL_USER: smartwin
      MYSQL_PASSWORD: smartwin_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./tests/test-data.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: smartwin-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.10.0
    container_name: smartwin-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 20s
      timeout: 10s
      retries: 5

  neo4j:
    image: neo4j:5.13
    container_name: smartwin-neo4j
    environment:
      NEO4J_AUTH: neo4j/smartwin_pass
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: smartwin-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: smartwin
      RABBITMQ_DEFAULT_PASS: smartwin_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: smartwin-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: smartwin
      MYSQL_SERVICE_PASSWORD: smartwin_pass
    ports:
      - "8848:8848"
    depends_on:
      mysql:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: smartwin-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smartwin
      MINIO_ROOT_PASSWORD: smartwin_pass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: smartwin-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus-config.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: smartwin-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: smartwin_pass
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboards.json:/var/lib/grafana/dashboards/smartwin.json
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  mysql_data:
  redis_data:
  es_data:
  neo4j_data:
  rabbitmq_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: smartwin-network
