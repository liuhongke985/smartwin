# SmartWin Docker Compose
# 创建日期: 2026-07-27
version: "3.9"
services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - smartwin-net
  backend:
    image: eclipse-temurin:21-jre
    command: ["sh","-c","sleep infinity"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_OPTS: -Xms256m -Xmx512m
    ports:
      - "8081:8080"
    networks:
      - smartwin-net
  frontend:
    image: node:22-alpine
    command: ["sh","-c","sleep infinity"]
    ports:
      - "5173:5173"
    networks:
      - smartwin-net
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartwin
      POSTGRES_USER: smartwin
      POSTGRES_PASSWORD: smartwin
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - smartwin-net
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - smartwin-net
networks:
  smartwin-net:
    driver: bridge
volumes:
  pg-data:
