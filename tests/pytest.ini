# SmartWin Python Test Configuration
# Documentation: https://docs.pytest.org/en/stable/reference/customize.html

[pytest]
# Test discovery
testpaths = ai-module/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    --verbose
    --tb=short
    --strict-markers
    --no-header
    --cov=ai-module
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
    --cov-fail-under=80

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may use test database)
    slow: Slow tests (> 5 seconds)
    ai: Tests requiring AI model (may skip in CI if no GPU)
    smoke: Smoke tests for quick verification

# Log settings
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file = tests/pytest.log
log_file_level = DEBUG

# Timeout
timeout = 60
timeout_method = thread

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:torch.*

# Environment variables for tests
env =
    ENVIRONMENT=test
    LOG_LEVEL=DEBUG
