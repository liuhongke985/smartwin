# SmartWin SonarQube Configuration
# Usage: sonar-scanner -Dproject.settings=tools/sonarqube-config.properties

# Project identification
sonar.projectKey=smartwin
sonar.projectName=SmartWin AI Governance Platform
sonar.projectVersion=1.0.0

# Source encoding
sonar.sourceEncoding=UTF-8

# Source paths
sonar.sources=src/main/java,ai-module
sonar.tests=src/test/java,ai-module/tests

# Java configuration
sonar.java.source=17
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/dependency/*.jar

# Coverage reports
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.python.coverage.reportPaths=ai-module/coverage.xml

# Exclusions
sonar.exclusions=\
  **/generated/**,\
  **/target/**,\
  **/node_modules/**,\
  **/*.min.js,\
  **/test-data/**,\
  **/*Test.java,\
  **/*IT.java,\
  **/config/**

sonar.test.exclusions=\
  **/test/**

# Code duplication
sonar.cpd.exclusions=\
  **/dto/**,\
  **/entity/**,\
  **/model/**

# Quality gate
sonar.qualitygate.wait=true

# Analysis parameters
sonar.analysis.mode=publish
sonar.links.homepage=https://github.com/liuhongke985/smartwin
sonar.links.ci=https://github.com/liuhongke985/smartwin/actions
sonar.links.issue=https://github.com/liuhongke985/smartwin/issues
sonar.links.scm=https://github.com/liuhongke985/smartwin
