# SmartWin Pre-commit Configuration
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: detect-private-key
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/psf/black
    rev: 23.12.0
    hooks:
      - id: black
        language_version: python3.11
        files: '^ai-module/.*\.py$'

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
        files: '^ai-module/.*\.py$'

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=88', '--extend-ignore=E203']
        files: '^ai-module/.*\.py$'

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: checkstyle
        name: Java Checkstyle
        entry: mvn checkstyle:check
        language: system
        files: '\.java$'
        pass_filenames: false

      - id: no-secrets
        name: Check for secrets
        entry: bash -c 'if grep -rE "(password|secret|token|api.key)\s*=\s*[\"'"'"'][^\"'"'"']+[\"'"'"']" --include="*.properties" --include="*.yml" --include="*.yaml" .; then echo "Potential secrets found!"; exit 1; fi'
        language: system
        pass_filenames: false
