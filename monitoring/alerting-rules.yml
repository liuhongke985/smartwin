# SmartWin 告警规则
groups:
  - name: smartwin.rules
    rules:
      - alert: SmartWinServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service down"
          description: "A SmartWin service is unreachable"
