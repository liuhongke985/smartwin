# SmartWin Prometheus 配置
global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: smartwin-backend
    static_configs:
      - targets: ['backend:8080']
  - job_name: smartwin-gateway
    static_configs:
      - targets: ['gateway:80']
